<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Ma présentation</title>

      <link rel="stylesheet" href="dist/reveal.css">
      <link rel="stylesheet" href="dist/theme/white.css">
      <link rel="stylesheet" href="css/theme-pictet-inspire.css">
  </head>

  <body>
    <div class="reveal">
      <div class="slides">

        <section>
          <h1>AI research talk</h1>

          <p>Review of the article:
            Olympiad-level formal mathematical reasoning with reinforcement learning </p>

          <p>Luc Pétiard</p>
          <figure>
		      <img src="images/Olympiad-level_formal_math_reasoning.png" alt="Description de la photo">
          </figure>
        </section>


        <section>
          <!-- <h2>Démonstration interactive</h2> -->

          <iframe
            data-src="timeline-resultats-mathematiques.html"
            title="Milestones in Computer-Assisted Mathematics"
            class="page-integree"
          ></iframe>
        </section>
	  
        <section>
          <!-- <h2>Une image</h2> -->
           <figure>
              <img
                  src="images/vibe_mathed.png"
                  alt="Description de la photo"
                  style="width: 85%; height: auto;"
                  >
                  <figcaption>vibemathed.com</figcaption>
          </figure>
        </section>



        <section>
          <h2>What happened in 2025?</h2>
        </section>

        <section>
          <!-- <h2>Démonstration interactive</h2> -->

          <iframe
            data-src="mcts_visualizer.html"
            title="Démonstration mathématique"
            class="page-integree"
          ></iframe>
        </section>

        <section
          data-background-iframe="mcts_visualizer.html"
          data-background-interactive
        >
        </section>

        <section>
          <h2>Thank you!</h2>
          <p>Any questions?</p>
        </section>








      </div>
    </div>







    <script src="dist/reveal.js"></script>

    <!-- Plugin mathématique de reveal.js -->
    <script src="dist/plugin/math.js"></script>

    <script>
      Reveal.initialize({
        hash: true,
        slideNumber: true,

        // Activation du rendu LaTeX avec KaTeX
        plugins: [RevealMath.KaTeX]
      });
    </script>
  </body>
</html>
