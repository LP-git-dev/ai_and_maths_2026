<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Présentation locale</title>
<link rel="stylesheet" href="./dist/reveal.css">
<link rel="stylesheet" href="./dist/theme/white.css">
<style>
/* Contenu intégré depuis milestones_comp_assist_maths(2).html. */
:root{--ink:#17213a;--muted:#667085;--axis:#aab3c2;--accent:#6c5ce7;--accent-dark:#4d3fbd;--accent-soft:#eeeaff;--paper:#fff}
.reveal{color:var(--ink)}.reveal .slides section{text-align:left;padding:0}.timeline-slide h2{margin:0 0 .12em;font-size:1.2em}.timeline-slide .subtitle{margin:0 0 .45em;font-size:.44em;color:var(--muted)}
#math-timeline{display:block;width:100%;height:auto;overflow:visible}.timeline-axis{stroke:var(--axis);stroke-width:5;stroke-linecap:round}.tick{stroke:var(--axis);stroke-width:2}.connector{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 6}.marker-halo{fill:var(--accent-soft)}.marker{fill:var(--accent);stroke:white;stroke-width:4}.card{fill:var(--paper);stroke:var(--accent-soft);stroke-width:3}.tick-label,.year-label,.result-label{font-family:Inter,system-ui,sans-serif}.tick-label{fill:var(--muted);font-size:16px}.year-label{fill:var(--accent-dark);font-size:22px;font-weight:800}.result-label{fill:var(--ink);font-size:17px;font-weight:600}
</style></head><body>
<div class="reveal"><div class="slides">
<section><h1>Ma présentation</h1><p>Appuyez sur → pour continuer.</p></section>
<!-- Section issue de milestones_comp_assist_maths(2).html. -->
<section class="timeline-slide"><h2>Milestones in Computer-Assisted Mathematics</h2><p class="subtitle">From 1950 to 2025</p><svg id="math-timeline" viewBox="0 0 1200 620" role="img" aria-label="Chronologie de résultats mathématiques de 1950 à 2025"></svg></section>
<section><h2>Slide suivante</h2><p>La navigation est toujours celle de Reveal.js.</p></section>
</div></div>
<script>
const events=[
 {year:1953,result:"Verification of the Riemann Hypothesis for the first zeros",side:"above"},
 {year:1976,result:"Four Color Theorem",side:"below"},
 {year:1989,result:"Nonexistence of a projective plane of order 10",side:"above"},
 {year:1998,result:"Kepler Conjecture",side:"below"},
 {year:2016,result:"Boolean Pythagorean Triples Problem",side:"above"}
];
const svg=document.querySelector("#math-timeline"),NS="http://www.w3.org/2000/svg",axisY=322,axisStart=72,axisEnd=1128,cardW=230,cardH=112;
const x=year=>axisStart+((year-1950)/75)*(axisEnd-axisStart);
function el(name,attrs={},text=""){const node=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text)node.textContent=text;return node}
function wrap(text,max=26){const lines=[];let line="";text.split(/\s+/).forEach(word=>{const candidate=line?`${line} ${word}`:word;if(candidate.length>max&&line){lines.push(line);line=word}else line=candidate});if(line)lines.push(line);return lines.slice(0,4)}
svg.append(el("line",{x1:axisStart,y1:axisY,x2:axisEnd,y2:axisY,class:"timeline-axis"}));
[1950,1960,1970,1980,1990,2000,2010,2020,2025].forEach(year=>{const px=x(year);svg.append(el("line",{x1:px,y1:axisY-10,x2:px,y2:axisY+10,class:"tick"}));svg.append(el("text",{x:px,y:axisY+38,"text-anchor":"middle",class:"tick-label"},String(year)))});
events.forEach((event,index)=>{const px=x(event.year),above=event.side==="above",cardY=above?68:414,cardX=Math.max(12,Math.min(1200-cardW-12,px-cardW/2)),group=el("g",{class:"fragment fade-in","data-fragment-index":index});group.append(el("line",{x1:px,y1:axisY,x2:px,y2:above?cardY+cardH:cardY,class:"connector"}));group.append(el("rect",{x:cardX,y:cardY,width:cardW,height:cardH,rx:16,ry:16,class:"card"}));group.append(el("text",{x:cardX+16,y:cardY+29,class:"year-label"},String(event.year)));const label=el("text",{x:cardX+16,y:cardY+55,class:"result-label"});wrap(event.result).forEach((line,i)=>label.append(el("tspan",{x:cardX+16,dy:i===0?0:20},line)));group.append(label);group.append(el("circle",{cx:px,cy:axisY,r:17,class:"marker-halo"}));group.append(el("circle",{cx:px,cy:axisY,r:9,class:"marker"}));svg.append(group)});
</script>
<script src="./dist/reveal.js"></script>
<script>Reveal.initialize({hash:true,controls:true,progress:true,transition:"fade"});</script>
</body></html>
