<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronologie des preuves assistées par ordinateur</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/theme/white.css">

  <style>
    :root {
      --ink: #17213a;
      --muted: #667085;
      --axis: #aab3c2;
      --accent: #6c5ce7;
      --accent-dark: #4d3fbd;
      --accent-soft: #eeeaff;
      --paper: #ffffff;
    }

    .reveal { color: var(--ink); }

    .reveal .slides section {
      text-align: left;
      padding: 0;
    }

    .timeline-slide h2 {
      margin: 0 0 0.12em;
      font-size: 1.2em;
      color: var(--ink);
    }

    .timeline-slide .subtitle {
      margin: 0 0 0.45em;
      font-size: 0.44em;
      color: var(--muted);
    }

    #math-timeline {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .timeline-axis { stroke: var(--axis); stroke-width: 5; stroke-linecap: round; }
    .tick { stroke: var(--axis); stroke-width: 2; }
    .connector { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 7 6; }
    .marker-halo { fill: var(--accent-soft); }
    .marker { fill: var(--accent); stroke: white; stroke-width: 4; }
    .card { fill: var(--paper); stroke: var(--accent-soft); stroke-width: 3; }

    .tick-label,
    .year-label,
    .result-label {
      font-family: Inter, system-ui, sans-serif;
    }

    .tick-label { fill: var(--muted); font-size: 16px; }
    .year-label { fill: var(--accent-dark); font-size: 22px; font-weight: 800; }
    .result-label { fill: var(--ink); font-size: 17px; font-weight: 600; }

    .hint {
      position: absolute;
      right: 0;
      bottom: -0.3em;
      margin: 0;
      font-size: 0.35em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <!-- Copiez cette section dans votre deck reveal.js existant. -->
      <section class="timeline-slide">
        <h2>Milestones in Computer-Assisted Mathematics</h2>
        <p class="subtitle">From 1950 to 2025</p>
        <svg id="math-timeline" viewBox="0 0 1200 620" role="img"
             aria-label="Chronologie de résultats mathématiques de 1950 à 2025"></svg>
        <!-- <p class="hint">→ pour révéler le jalon suivant</p> -->
      </section>
    </div>
  </div>

  <script>
    /* DONNÉES À MODIFIER ----------------------------------------------------
       `side` peut valoir "above" ou "below" pour placer l’annotation.
       -------------------------------------------------------------------- */
    const events = [
      {
        year: 1953,
        result: "Verification of the Riemann Hypothesis for the first zeros",
        side: "above"
      },
      {
        year: 1976,
        result: "Four Color Theorem",
        side: "below"
      },
      {
        year: 1989,
        result: "Nonexistence of a projective plane of order 10",
        side: "above"
      },
      {
        year: 1998,
        result: "Kepler Conjecture",
        side: "below"
      },
      {
        year: 2016,
        result: "Boolean Pythagorean Triples Problem",
        side: "above"
      }
    ];

    const svg = document.querySelector("#math-timeline");
    const NS = "http://www.w3.org/2000/svg";
    const startYear = 1950;
    const endYear = 2025;
    const axisY = 322;
    const axisStart = 72;
    const axisEnd = 1128;
    const cardW = 230;
    const cardH = 112;

    const x = year => axisStart + ((year - startYear) / (endYear - startYear)) * (axisEnd - axisStart);

    function el(name, attrs = {}, text = "") {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (text !== "") node.textContent = text;
      return node;
    }

    function wrap(text, maxChars = 26) {
      const words = text.split(/\s+/);
      const lines = [];
      let line = "";
      words.forEach(word => {
        const candidate = line ? `${line} ${word}` : word;
        if (candidate.length > maxChars && line) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      });
      if (line) lines.push(line);
      return lines.slice(0, 4);
    }

    // Axe principal, bornes et graduations décennales.
    svg.append(el("line", { x1: axisStart, y1: axisY, x2: axisEnd, y2: axisY, class: "timeline-axis" }));

    const tickYears = [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020, 2025];
    tickYears.forEach(year => {
      const px = x(year);
      svg.append(el("line", { x1: px, y1: axisY - 10, x2: px, y2: axisY + 10, class: "tick" }));
      svg.append(el("text", { x: px, y: axisY + 38, "text-anchor": "middle", class: "tick-label" }, String(year)));
    });

    // Un groupe = un fragment reveal.js = un appui sur la flèche droite.
    events.forEach((event, index) => {
      const px = x(event.year);
      const above = event.side === "above";
      const cardY = above ? 68 : 414;
      const cardX = Math.max(12, Math.min(1200 - cardW - 12, px - cardW / 2));
      const connectorEndY = above ? cardY + cardH : cardY;

      const group = el("g", {
        class: "fragment fade-in",
        "data-fragment-index": index
      });

      // Le connecteur est inséré avant les autres éléments pour rester derrière.
      group.append(el("line", {
        x1: px, y1: axisY,
        x2: px, y2: connectorEndY,
        class: "connector"
      }));

      group.append(el("rect", {
        x: cardX, y: cardY, width: cardW, height: cardH,
        rx: 16, ry: 16, class: "card"
      }));

      group.append(el("text", {
        x: cardX + 16, y: cardY + 29, class: "year-label"
      }, String(event.year)));

      const resultText = el("text", {
        x: cardX + 16, y: cardY + 55, class: "result-label"
      });
      wrap(event.result).forEach((line, lineIndex) => {
        resultText.append(el("tspan", {
          x: cardX + 16,
          dy: lineIndex === 0 ? 0 : 20
        }, line));
      });
      group.append(resultText);

      group.append(el("circle", { cx: px, cy: axisY, r: 17, class: "marker-halo" }));
      group.append(el("circle", { cx: px, cy: axisY, r: 9, class: "marker" }));
      svg.append(group);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      controls: true,
      progress: true,
      center: true,
      transition: "fade"
    });
  </script>
</body>
</html>
